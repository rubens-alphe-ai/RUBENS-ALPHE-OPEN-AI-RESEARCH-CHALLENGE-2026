name: RA-PSI visitor notes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "visitors/**"
      - "schemas/visitor-note.schema.json"
      - "scripts/validate_visitor_notes.py"

permissions:
  contents: read

jobs:
  validate-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public tree for secrets
        run: python scripts/check_public_safety.py .
      - name: Validate notes and recompute proofs of reading
        run: python scripts/validate_visitor_notes.py
